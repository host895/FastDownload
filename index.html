<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.</title>
<style>
  html,body{margin:0;padding:0;background:#fff;min-height:100vh}
  body{padding:8px 10px;text-align:left}
  #out{color:#000;font-family:Consolas,monospace;font-size:11px;line-height:1.4;
       word-break:break-all;direction:ltr;text-align:left;white-space:pre-wrap;
       user-select:all;-webkit-user-select:all;margin:0}
</style>
</head>
<body>
<div id="out"></div>

<script>
const API_KEY = "754298";
const full = location.href;

const idx = full.indexOf('api=');
if (idx === -1){
  document.body.innerHTML = '<div style="font-family:Consolas,monospace;font-size:11px;color:#000">خطأ للحصول علي ال api key مجانا تواصل هنا تليجرام<br>@lego_courses</div>';
  throw 0;
}

const qIndex = full.indexOf('?');
const qs = new URLSearchParams(qIndex >= 0 ? full.substring(qIndex) : '');
if (qs.get('api') !== API_KEY){
  document.body.innerHTML = '<div style="font-family:Consolas,monospace;font-size:11px;color:#000">خطأ للحصول علي ال api key مجانا تواصل هنا تليجرام<br>@lego_courses</div>';
  throw 0;
}

const apiPartEnd = full.indexOf('&', idx);
const partToEncode = apiPartEnd >= 0 ? full.substring(apiPartEnd + 1) : '';

if (!partToEncode){
  document.body.innerHTML = '<div style="font-family:Consolas,monospace;font-size:11px;color:#c00">لا يوجد بيانات للتشفير</div>';
  throw 0;
}

const enc = btoa(unescape(encodeURIComponent(partToEncode)))
  .replace(/=+$/,'')
  .replace(/\+/g,'-')
  .replace(/\//g,'_');

const baseUrl = location.origin + location.pathname.replace('index.html', 'dl.html');
const finalUrl = baseUrl + '?u=' + enc;

document.getElementById('out').textContent = finalUrl;
</script>
</body>
</html>
