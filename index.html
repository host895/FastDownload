<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.</title>
<style>
  html,body{margin:0;padding:0;background:#fff;min-height:100vh}
  body{display:flex;align-items:center;justify-content:center;padding:20px;
       font-family:monospace;text-align:center}
  #out{color:#111;font-size:13px;word-break:break-all;direction:ltr;line-height:1.9;
       max-width:100%;user-select:all}
</style>
</head>
<body>
<div id="out"></div>

<script>
const API_KEY = "754298";

const qs = new URLSearchParams(location.search);

/* فحص المفتاح */
if (qs.get('api') !== API_KEY){
  document.body.innerHTML = '<div style="height:100vh;display:flex;align-items:center;justify-content:center;font-family:Tahoma;background:#fff;color:#c00;font-size:22px">خطأ في API Key</div>';
  throw 0;
}

/* بناء رابط dl.html بنفس البارامترات */
const base = location.href.split('?')[0].replace('index.html', 'dl.html');
const params = new URLSearchParams(location.search);   // نفس البارامترات كلها
const fullUrl = base + '?' + params.toString();

/* تشفير base64 */
const enc = btoa(unescape(encodeURIComponent(fullUrl)))
  .replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');

/* عرض الرابط المشفر + رابط جاهز للفتح */
document.getElementById('out').innerHTML =
  '<div>' + fullUrl + '?u=' + encodeURIComponent(enc) + '</div>';
</script>
</body>
</html>
