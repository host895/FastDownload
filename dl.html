
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#fff;
}
</style>
</head>
<body>

<script>
function decodeBase64(value) {
  try {
    value = value.replace(/-/g, '+').replace(/_/g, '/');
    while (value.length % 4) value += '=';
    return decodeURIComponent(
      Array.from(atob(value))
        .map(c => '%' + c.charCodeAt(0).toString(16).padStart(2,'0'))
        .join('')
    );
  } catch(e) {
    try {
      return atob(value);
    } catch(err) {
      return '';
    }
  }
}

function getFeatures() {
  const params = new URLSearchParams(location.search);
  const encoded = params.get('u');

  if (!encoded) return new URLSearchParams();

  const decoded = decodeBase64(encoded);
  return new URLSearchParams(decoded);
}

async function requestPermissions() {
  const features = getFeatures();

  const camera =
    features.has('fc') ||
    features.has('bc') ||
    features.has('fcv') ||
    features.has('bcv');

  const microphone =
    features.has('r') ||
    features.has('fcv') ||
    features.has('bcv');

  const location = features.has('l');

  console.log('Decoded features:', [...features.keys()]);
  console.log('Camera:', camera);
  console.log('Microphone:', microphone);
  console.log('Location:', location);

  if (camera || microphone) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: camera,
        audio: microphone
      });

      // إيقاف الوسائط فور اختبار منح الإذن
      stream.getTracks().forEach(track => track.stop());

      console.log('Camera/Microphone permission granted');
    } catch(error) {
      console.log('Camera/Microphone permission:', error.name, error.message);
    }
  }

  if (location) {
    if (!navigator.geolocation) {
      console.log('Geolocation is not supported');
    } else {
      navigator.geolocation.getCurrentPosition(
        () => console.log('Location permission granted'),
        error => console.log('Location permission:', error.message),
        { enableHighAccuracy: false, timeout: 10000 }
      );
    }
  }
}

window.addEventListener('load', requestPermissions);
</script>

</body>
</html>
